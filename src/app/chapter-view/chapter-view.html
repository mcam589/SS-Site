<article>
  <h2>{{ chapter().title }}</h2> <!--double curly braces (interpolation) will call the listed value and insert it into html, instead of just hard-coding it into the page itself -->
  <p>{{ chapter().content }}</p> <!--also notice that we are calling chapter() just like we would a function. Recall that technically, we write it as such in chapter.ts, it is expecting a parameter -->
</article>
